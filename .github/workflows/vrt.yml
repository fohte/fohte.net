name: VRT

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5

      - run: |
          corepack enable
          mise reshim

      - run: pnpm install --frozen-lockfile

      - uses: fohte/storybook-vrt-workflows/vrt-capture@b1745100ad0c07758b763db13f25e5a0f2d7beec # v0.1.5
        with:
          project: fohte-net-pages
          shard: 1
          shards: 1
          capture-script: vrt:capture
          package-dir: .
          screenshots-dir: __screenshots__/fohte-net

  report:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    concurrency:
      group: vrt-report-fohte-net-${{ (github.ref == 'refs/heads/master') && 'push' || 'pr' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5

      - run: |
          corepack enable
          mise reshim

      - run: pnpm install --frozen-lockfile

      - uses: fohte/storybook-vrt-workflows/vrt-report@b1745100ad0c07758b763db13f25e5a0f2d7beec # v0.1.5
        with:
          package-dir: .
          screenshots-dir: __screenshots__/fohte-net
          r2-bucket: fohte-net-vrt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # vrt-report treats only main as its baseline branch; this repository uses master.
      - name: Update master baseline
        id: master-baseline
        if: github.ref == 'refs/heads/master'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://8d88a085ccc7b11f252419e2f3a25fd6.r2.cloudflarestorage.com
          BASELINE_URI: s3://fohte-net-vrt/baseline/actual
        run: |
          set -euo pipefail
          current_head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_count=$(jq '(.failedItems | length) + (.newItems | length) + (.deletedItems | length)' .reg/out.json)
          if [ "$diff_count" -eq 0 ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          aws s3 cp __screenshots__/fohte-net "$BASELINE_URI/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --region auto

          jq -r '.deletedItems[]' .reg/out.json | while IFS= read -r item; do
            aws s3 rm "$BASELINE_URI/$item" \
              --endpoint-url "$R2_ENDPOINT" \
              --region auto
          done

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Mark master baseline as current
        if: github.ref == 'refs/heads/master' && steps.master-baseline.outputs.updated == 'true'
        uses: ./.vrt-shared/vrt-status
        with:
          repo: ${{ github.repository }}
          sha: ${{ github.sha }}
          state: success
          description: Baseline updated
          target-url: https://fohte-net-vrt.fohte.net/branch/master/index.html
          github-token: ${{ secrets.GITHUB_TOKEN }}
